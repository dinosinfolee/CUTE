<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>트롤리 딜레마 — 나는 어떻게 생각할까</title>
<script>
  /* CUTE가 화면 준비 전에 복원 상태를 보낼 수 있다. 여기서 받아 두었다가 아래에서 처리한다. */
  window.__cuteQueue = [];
  window.addEventListener("message", function (event) { if (!window.__cuteReady) window.__cuteQueue.push(event); });
</script>
<style>
  /* 교사가 따로 만들어 가져온 앱이다. CUTE 화면과 같아 보일 이유가 없고,
     옆 칸의 데이터 탐색 앱과도 달라야 한다. 여기는 '읽고 쓰는 노트' 쪽으로 잡았다. */
  :root {
    --ink: #1a1815; --ink-2: #57514a; --ink-3: #8b8377;
    --paper: #fbf9f4; --sheet: #ffffff;
    --rule: #ddd6c9; --rule-2: #ece6da;
    --mark: #9a5b18; --mark-soft: #f5ecdf;
    --serif: Georgia, "Times New Roman", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.6; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 26px 20px 36px; }
  header { border-bottom: 1px solid var(--ink); padding-bottom: 14px; }
  .kicker { color: var(--mark); font-family: var(--sans); font-size: .69rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  header h1 { margin-top: 7px; font-family: var(--serif); font-size: 1.6rem; font-weight: 400; line-height: 1.25; letter-spacing: -.01em; }
  header p { margin-top: 8px; color: var(--ink-2); font-size: .84rem; }
  .no-answer { display: block; margin-top: 12px; border-left: 2px solid var(--mark); padding-left: 10px; color: var(--mark); font-size: .76rem; font-weight: 600; }
  .steps { display: flex; flex-wrap: wrap; gap: 5px; margin: 18px 0; }
  .steps button { min-width: 32px; border: 1px solid var(--rule); background: transparent; padding: 5px 9px; color: var(--ink-3); cursor: pointer; font: inherit; font-family: var(--serif); font-size: .82rem; }
  .steps button:hover { border-color: var(--ink-3); color: var(--ink); }
  .steps button[aria-current="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .steps button.done { color: var(--mark); border-color: var(--mark); }
  .steps button.done[aria-current="true"] { background: var(--mark); border-color: var(--mark); color: var(--paper); }
  .sheet { border: 1px solid var(--rule); background: var(--sheet); padding: 24px 22px; }
  .scene-no { color: var(--ink-3); font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .scene h2 { margin-top: 4px; font-family: var(--serif); font-size: 1.32rem; font-weight: 400; }
  .scene .story { margin-top: 14px; font-family: var(--serif); font-size: 1.02rem; line-height: 1.75; white-space: pre-line; }
  .scene .ask { border-top: 1px solid var(--rule-2); margin-top: 18px; padding-top: 16px; font-size: .95rem; font-weight: 700; }
  .choices { display: grid; margin-top: 12px; gap: 0; }
  .choice { display: grid; align-items: start; border-bottom: 1px solid var(--rule-2); gap: 12px; padding: 13px 4px; cursor: pointer; grid-template-columns: 16px minmax(0, 1fr); }
  .choice:first-child { border-top: 1px solid var(--rule-2); }
  .choice:hover { background: #fcfaf6; }
  .choice input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--mark); }
  .choice.is-picked { background: var(--mark-soft); box-shadow: inset 3px 0 0 var(--mark); }
  .choice b { font-size: .92rem; font-weight: 700; }
  .choice small { display: block; margin-top: 2px; color: var(--ink-2); font-size: .8rem; }
  .sure { margin-top: 20px; }
  .sure-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sure-head span:first-child { color: var(--ink-2); font-size: .78rem; font-weight: 700; }
  .sure-head span:last-child { color: var(--mark); font-family: var(--serif); font-size: .88rem; font-style: italic; }
  input[type="range"] { width: 100%; margin-top: 8px; accent-color: var(--mark); }
  .sure-scale { display: flex; justify-content: space-between; color: var(--ink-3); font-size: .7rem; }
  label.block { display: block; margin-top: 20px; margin-bottom: 8px; font-size: .88rem; font-weight: 700; }
  textarea { width: 100%; min-height: 104px; border: 0; border-bottom: 1px solid var(--ink-3); background: repeating-linear-gradient(transparent, transparent 27px, var(--rule-2) 27px, var(--rule-2) 28px); padding: 4px 2px; color: var(--ink); font: inherit; font-family: var(--serif); font-size: 1rem; line-height: 28px; resize: vertical; }
  textarea:focus-visible { border-bottom-color: var(--mark); outline: none; }
  .count { margin-top: 6px; color: var(--ink-3); font-size: .72rem; text-align: right; }
  .nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }
  .nav button { border: 1px solid var(--ink); background: transparent; padding: 9px 18px; color: var(--ink); cursor: pointer; font: inherit; font-size: .84rem; font-weight: 600; }
  .nav button:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .nav button.primary { border-color: var(--mark); background: var(--mark); color: var(--paper); }
  .nav button.primary:hover { background: #7f4a12; }
  .nav button:disabled { border-color: var(--rule); color: var(--ink-3); cursor: default; }
  table { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: .85rem; }
  th, td { border-bottom: 1px solid var(--rule-2); padding: 9px 4px; text-align: left; vertical-align: top; }
  th { border-bottom-color: var(--ink); color: var(--ink-2); font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  td:first-child { font-family: var(--serif); }
  td.none { color: var(--ink-3); font-style: italic; }
  .hint { border-left: 2px solid var(--mark); margin-top: 20px; padding: 2px 0 2px 14px; font-family: var(--serif); font-size: .95rem; line-height: 1.7; }
  @media (max-width: 480px) { .wrap { padding: 18px 14px 28px; } .sheet { padding: 18px 15px; } header h1 { font-size: 1.35rem; } .scene .story { font-size: .96rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">사고 실험</div>
    <h1>트롤리 딜레마<br />나는 어떻게 생각할까</h1>
    <p>다섯 가지 상황을 읽고 선택한 뒤, 왜 그렇게 생각했는지 적어 보세요.</p>
    <span class="no-answer">정답이 없는 활동입니다. 채점하지 않습니다.</span>
  </header>

  <nav class="steps" id="steps" aria-label="상황 이동"></nav>

  <section class="sheet" id="scene"></section>

  <div class="nav">
    <button type="button" id="prev">← 이전</button>
    <button type="button" id="next" class="primary">다음 →</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ── 상황 ──────────────────────────────────────────────────
     한쪽으로 몰지 않도록 두 선택지를 같은 무게로 적는다. */
  var SCENES = [
    {
      id: "lever", title: "선로 전환기",
      story: "브레이크가 고장 난 전차가 달려오고 있습니다. 이대로라면 선로 위에서 일하던 다섯 사람이 사고를 당합니다.\n당신 앞에는 선로를 바꾸는 레버가 있습니다. 레버를 당기면 전차는 옆 선로로 가고, 그곳에는 한 사람이 있습니다.",
      ask: "당신은 레버를 당기겠습니까?",
      options: [
        { value: "당긴다", label: "레버를 당긴다", hint: "다섯 사람 대신 한 사람이 사고를 당합니다." },
        { value: "당기지 않는다", label: "레버를 당기지 않는다", hint: "전차는 원래 가던 선로로 갑니다." }
      ],
      reason: "그렇게 선택한 이유를 적어 보세요."
    },
    {
      id: "bridge", title: "육교 위에서",
      story: "같은 전차가 다섯 사람을 향해 달려옵니다. 이번에 당신은 선로 위 육교에 서 있고, 레버는 없습니다.\n옆에는 몸집이 아주 큰 사람이 있습니다. 그 사람을 선로로 밀면 전차가 멈춰 다섯 사람은 살고, 그 사람은 사고를 당합니다.",
      ask: "당신은 그 사람을 밀겠습니까?",
      options: [
        { value: "민다", label: "민다", hint: "한 사람이 사고를 당하고 다섯 사람이 삽니다." },
        { value: "밀지 않는다", label: "밀지 않는다", hint: "전차는 그대로 달려갑니다." }
      ],
      reason: "1번과 같은 숫자인데, 선택이 같았나요 달랐나요? 그 까닭을 적어 보세요."
    },
    {
      id: "car", title: "자율주행차",
      story: "자율주행차가 달리는 중 브레이크가 고장 났습니다. 차에는 당신 한 사람이 타고 있습니다.\n그대로 직진하면 횡단보도를 건너던 다섯 사람이 사고를 당합니다. 핸들을 꺾으면 차는 벽에 부딪혀 탑승자인 당신이 크게 다칩니다.",
      ask: "이 차는 어떻게 움직이도록 만들어져야 할까요?",
      options: [
        { value: "탑승자를 보호", label: "탑승자를 보호하도록 만든다", hint: "차는 그대로 직진합니다." },
        { value: "더 많은 사람을 보호", label: "더 많은 사람을 보호하도록 만든다", hint: "차는 핸들을 꺾습니다." },
        { value: "미리 정하지 않는다", label: "미리 정해 두지 않는다", hint: "그 순간의 상황에 맡깁니다." }
      ],
      reason: "만약 그 차를 당신이 산다면, 같은 답을 하겠습니까? 그 이유도 함께 적어 보세요."
    },
    {
      id: "hospital", title: "응급실",
      story: "한 병원에 장기 이식을 기다리는 환자 다섯 명이 있습니다. 이식을 받지 못하면 모두 위험합니다.\n마침 건강한 사람 한 명이 검진을 받으러 왔고, 그 사람의 장기는 다섯 명 모두와 맞습니다.",
      ask: "의사는 그 한 사람을 희생시켜 다섯 명을 살려야 할까요?",
      options: [
        { value: "희생시킨다", label: "그렇게 해야 한다", hint: "한 사람 대신 다섯 명이 삽니다." },
        { value: "희생시키지 않는다", label: "그래서는 안 된다", hint: "다섯 명은 계속 기다리게 됩니다." }
      ],
      reason: "숫자는 1번·2번과 같습니다. 그런데도 느낌이 달랐다면, 무엇이 달랐는지 적어 보세요."
    },
    {
      id: "who", title: "누가 정할까",
      story: "자율주행차가 사고를 피할 수 없을 때 어떻게 움직일지는 누군가 미리 정해 두어야 합니다.",
      ask: "그 규칙은 누가 정해야 할까요?",
      options: [
        { value: "만든 회사", label: "차를 만든 회사", hint: "기술을 가장 잘 아는 쪽입니다." },
        { value: "정부·국회", label: "정부나 국회", hint: "사회가 함께 정한 규칙이 됩니다." },
        { value: "차 주인", label: "차를 산 사람", hint: "결과를 직접 떠안는 쪽입니다." },
        { value: "시민이 함께", label: "시민이 함께 논의해서", hint: "모두에게 영향을 주는 일이기 때문입니다." }
      ],
      reason: "그렇게 생각한 이유와, 그 방식의 약점은 무엇일지 적어 보세요."
    }
  ];
  var REFLECT_ID = "reflect";
  var REFLECT_PROMPT = "숫자 말고 무엇이 내 선택을 갈랐을까요? 다섯 상황을 통틀어 적어 보세요.";

  /* ── 활동 기록 ─────────────────────────────────────────────
     CUTE 규격: 앱이 로그를 직접 들고 있다가 저장할 때마다 통째로 보낸다. */
  var MAX_EVENTS = 200;
  var events = [];
  function note(action, detail, coalesce) {
    var last = events[events.length - 1];
    if (coalesce && last && last.action === action && last.detail && detail &&
        last.detail.split(" — ")[0] === detail.split(" — ")[0]) {
      last.detail = detail; last.at = new Date().toISOString(); return;
    }
    events.push({ at: new Date().toISOString(), action: action, detail: detail });
    if (events.length > MAX_EVENTS) events = events.slice(-MAX_EVENTS);
  }

  /* ── 상태 ──────────────────────────────────────────────────── */
  var answers = {};   // { sceneId: { choice, sure, reason } }
  var reflection = "";
  var step = 0;       // 0..SCENES.length (마지막은 되돌아보기)
  var seen = {};

  function answerOf(id) {
    if (!answers[id]) answers[id] = { choice: "", sure: 3, reason: "" };
    return answers[id];
  }
  function sceneTitle(index) { return (index + 1) + ". " + SCENES[index].title; }
  function answeredCount() {
    return SCENES.filter(function (scene) { return answers[scene.id] && answers[scene.id].choice; }).length;
  }
  var SURE_WORDS = ["전혀 확신이 없다", "확신이 별로 없다", "보통이다", "어느 정도 확신한다", "매우 확신한다"];

  /* ── 그리기 ────────────────────────────────────────────────── */
  var stepsEl = document.getElementById("steps");
  var sceneEl = document.getElementById("scene");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function renderSteps() {
    stepsEl.innerHTML = "";
    SCENES.forEach(function (scene, index) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = String(index + 1);
      button.title = scene.title;
      if (index === step) button.setAttribute("aria-current", "true");
      if (answers[scene.id] && answers[scene.id].choice) button.className = "done";
      button.addEventListener("click", function () { go(index); });
      stepsEl.appendChild(button);
    });
    var last = document.createElement("button");
    last.type = "button";
    last.textContent = "되돌아보기";
    if (step === SCENES.length) last.setAttribute("aria-current", "true");
    if (reflection.trim()) last.className = "done";
    last.addEventListener("click", function () { go(SCENES.length); });
    stepsEl.appendChild(last);
  }

  function renderScene() {
    sceneEl.innerHTML = "";
    if (step === SCENES.length) { renderReflection(); return; }
    var scene = SCENES[step];
    var answer = answerOf(scene.id);

    var box = document.createElement("div");
    box.className = "scene";
    box.innerHTML = '<div class="scene-no">상황 ' + (step + 1) + " / " + SCENES.length + '</div>' +
      "<h2></h2><div class='story'></div><div class='ask'></div>";
    box.querySelector("h2").textContent = scene.title;
    box.querySelector(".story").textContent = scene.story;
    box.querySelector(".ask").textContent = scene.ask;

    var choices = document.createElement("div");
    choices.className = "choices";
    scene.options.forEach(function (option) {
      var label = document.createElement("label");
      label.className = "choice" + (answer.choice === option.value ? " is-picked" : "");
      var radio = document.createElement("input");
      radio.type = "radio"; radio.name = "choice-" + scene.id; radio.value = option.value;
      radio.checked = answer.choice === option.value;
      radio.addEventListener("change", function () {
        var changed = answer.choice && answer.choice !== option.value;
        answer.choice = option.value;
        note(changed ? "선택 바꿈" : "선택함", sceneTitle(step) + " — " + option.label);
        renderSteps(); renderScene();
      });
      var text = document.createElement("span");
      var strong = document.createElement("b"); strong.textContent = option.label;
      var small = document.createElement("small"); small.textContent = option.hint;
      text.appendChild(strong); text.appendChild(small);
      label.appendChild(radio); label.appendChild(text);
      choices.appendChild(label);
    });
    box.appendChild(choices);

    var sure = document.createElement("div");
    sure.className = "sure";
    sure.innerHTML = '<div class="sure-head"><span>얼마나 확신하나요?</span><span id="sure-word"></span></div>';
    var range = document.createElement("input");
    range.type = "range"; range.min = "1"; range.max = "5"; range.step = "1"; range.value = String(answer.sure);
    range.setAttribute("aria-label", "확신 정도");
    var word = sure.querySelector("#sure-word");
    word.textContent = SURE_WORDS[answer.sure - 1];
    range.addEventListener("input", function () {
      answer.sure = Number(range.value);
      word.textContent = SURE_WORDS[answer.sure - 1];
    });
    range.addEventListener("change", function () {
      note("확신 정도 정함", sceneTitle(step) + " — " + SURE_WORDS[answer.sure - 1], true);
    });
    sure.appendChild(range);
    var scale = document.createElement("div");
    scale.className = "sure-scale";
    scale.innerHTML = "<span>확신 없음</span><span>매우 확신</span>";
    sure.appendChild(scale);
    box.appendChild(sure);

    var label = document.createElement("label");
    label.className = "block"; label.setAttribute("for", "reason-input");
    label.textContent = scene.reason;
    box.appendChild(label);
    var area = document.createElement("textarea");
    area.id = "reason-input";
    area.placeholder = "짧아도 괜찮습니다. 생각이 바뀌었다면 바뀐 대로 적어도 좋아요.";
    area.value = answer.reason;
    var counter = document.createElement("div");
    counter.className = "count"; counter.textContent = answer.reason.length + "자";
    var timer = null;
    area.addEventListener("input", function () {
      answer.reason = area.value;
      counter.textContent = answer.reason.length + "자";
      // 글자마다 남기면 로그가 아니라 소음이 된다. 멈췄을 때 한 줄로 남긴다.
      window.clearTimeout(timer);
      timer = window.setTimeout(function () {
        if (answer.reason.trim()) note("이유 씀", sceneTitle(step) + " — " + answer.reason.trim().slice(0, 100), true);
      }, 1200);
    });
    box.appendChild(area); box.appendChild(counter);
    sceneEl.appendChild(box);

    if (!seen[scene.id]) { seen[scene.id] = true; note("상황 열람", sceneTitle(step)); }
    prevBtn.disabled = step === 0;
    nextBtn.textContent = "다음 →";
  }

  function renderReflection() {
    var box = document.createElement("div");
    box.className = "scene";
    box.innerHTML = '<div class="scene-no">마무리</div><h2>내 선택 되돌아보기</h2>';

    var table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>상황</th><th>내 선택</th><th>확신</th></tr></thead>";
    var tbody = document.createElement("tbody");
    SCENES.forEach(function (scene, index) {
      var answer = answers[scene.id];
      var tr = document.createElement("tr");
      var name = document.createElement("td"); name.textContent = sceneTitle(index);
      var pick = document.createElement("td");
      if (answer && answer.choice) { pick.textContent = answer.choice; } else { pick.textContent = "아직 고르지 않음"; pick.className = "none"; }
      var sure = document.createElement("td");
      sure.textContent = answer && answer.choice ? SURE_WORDS[answer.sure - 1] : "—";
      if (!(answer && answer.choice)) sure.className = "none";
      tr.appendChild(name); tr.appendChild(pick); tr.appendChild(sure);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    box.appendChild(table);

    var hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "1번·2번·4번은 '한 사람 대신 다섯 사람'이라는 숫자가 똑같습니다. 그런데도 선택이 갈렸다면, 당신은 숫자 말고 다른 것을 함께 보고 있었던 것입니다.";
    box.appendChild(hint);

    var label = document.createElement("label");
    label.className = "block"; label.setAttribute("for", "reflect-input");
    label.textContent = REFLECT_PROMPT;
    box.appendChild(label);
    var area = document.createElement("textarea");
    area.id = "reflect-input";
    area.style.minHeight = "120px";
    area.placeholder = "예: 직접 손을 대야 하는지, 그 사람이 원래 그 자리에 있었는지, 내가 그 자리에 있다면 어떨지…";
    area.value = reflection;
    var counter = document.createElement("div");
    counter.className = "count"; counter.textContent = reflection.length + "자";
    var timer = null;
    area.addEventListener("input", function () {
      reflection = area.value;
      counter.textContent = reflection.length + "자";
      window.clearTimeout(timer);
      timer = window.setTimeout(function () {
        if (reflection.trim()) note("되돌아보기 씀", reflection.trim().slice(0, 120), true);
      }, 1200);
    });
    box.appendChild(area); box.appendChild(counter);
    sceneEl.appendChild(box);

    if (!seen[REFLECT_ID]) { seen[REFLECT_ID] = true; note("되돌아보기 열람", "답한 상황 " + answeredCount() + "개"); }
    prevBtn.disabled = false;
    nextBtn.textContent = "처음으로";
  }

  function go(next) {
    step = Math.max(0, Math.min(SCENES.length, next));
    renderSteps(); renderScene();
    sceneEl.scrollIntoView({ block: "nearest" });
  }
  prevBtn.addEventListener("click", function () { go(step - 1); });
  nextBtn.addEventListener("click", function () { go(step >= SCENES.length ? 0 : step + 1); });

  /* ── CUTE 연동 ─────────────────────────────────────────────── */
  var CUTE_ORIGINS = ["https://cute.sanskit.com"];
  var DEV_ORIGIN = /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/;
  function allowedOrigin(origin) { return CUTE_ORIGINS.indexOf(origin) !== -1 || DEV_ORIGIN.test(origin); }

  function getCurrentState() {
    // 학생이 쓴 글 전문과 활동 로그는 여기에 둔다. 그래야 새로고침해도 이어진다.
    return { schemaVersion: 1, step: step, answers: answers, reflection: reflection, seen: seen, events: events };
  }
  function getActivity() {
    var results = [];
    SCENES.forEach(function (scene, index) {
      var answer = answers[scene.id];
      if (!answer || !answer.choice) return;
      // 정답이 없는 활동이다. correct는 어디에도 넣지 않는다.
      // CUTE는 이 앱 안에 어떤 상황이 있는지 모른다. 물음을 함께 보내야 답이 읽힌다.
      results.push({ label: sceneTitle(index) + " — 선택", prompt: scene.story + "\n" + scene.ask, value: answer.choice + " (" + SURE_WORDS[answer.sure - 1] + ")" });
      if (answer.reason.trim()) results.push({ label: sceneTitle(index) + " — 이유", prompt: scene.reason, value: answer.reason.trim().slice(0, 500) });
    });
    results.push({ label: "답한 상황 수", value: answeredCount() + " / " + SCENES.length });
    if (reflection.trim()) results.push({ label: "되돌아보기", prompt: REFLECT_PROMPT, value: reflection.trim().slice(0, 500) });
    return { schemaVersion: 1, events: events, results: results };
  }
  function restore(saved) {
    if (!saved || typeof saved !== "object") return;
    if (saved.answers && typeof saved.answers === "object") {
      SCENES.forEach(function (scene) {
        var item = saved.answers[scene.id];
        if (!item || typeof item !== "object") return;
        var valid = scene.options.some(function (option) { return option.value === item.choice; });
        answers[scene.id] = {
          choice: valid ? item.choice : "",
          sure: [1, 2, 3, 4, 5].indexOf(item.sure) !== -1 ? item.sure : 3,
          reason: typeof item.reason === "string" ? item.reason : ""
        };
      });
    }
    reflection = typeof saved.reflection === "string" ? saved.reflection : "";
    if (saved.seen && typeof saved.seen === "object") seen = saved.seen;
    if (Array.isArray(saved.events)) {
      events = saved.events.filter(function (e) { return e && typeof e.action === "string"; }).slice(-MAX_EVENTS);
    }
    step = typeof saved.step === "number" && saved.step >= 0 && saved.step <= SCENES.length ? saved.step : 0;
    renderSteps(); renderScene();
    note("이어서 열기", "답한 상황 " + answeredCount() + "개");
  }

  var answered = {};
  function handle(event) {
    if (event.source !== window.parent) return;
    if (!allowedOrigin(event.origin)) return;
    var msg = event.data;
    if (!msg || typeof msg !== "object") return;
    if (msg.cute === "state-request") {
      if (typeof msg.requestId !== "string" || answered[msg.requestId]) return;
      answered[msg.requestId] = true;
      var payload = { cute: "state-result", requestId: msg.requestId, state: {} };
      try { payload.state = getCurrentState(); } catch (error) { payload.state = {}; }
      // 활동 기록을 만들다 실패해도 저장 자체는 멈추면 안 된다.
      try { var activity = getActivity(); if (activity) payload.activity = activity; } catch (error) {}
      event.source.postMessage(payload, event.origin);
      return;
    }
    if (msg.cute === "state-restore") { try { restore(msg.state); } catch (error) {} }
  }

  renderSteps(); renderScene();
  window.addEventListener("message", handle);
  window.__cuteReady = true;
  (window.__cuteQueue || []).forEach(handle);
  window.__cuteQueue = [];
})();
</script>
</body>
</html>
