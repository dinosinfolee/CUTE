  /* CUTE가 화면 준비 전에 복원 상태를 보낼 수 있다. 여기서 받아 두었다가 아래에서 처리한다. */
  window.__cuteQueue = [];
  window.addEventListener("message", function (event) { if (!window.__cuteReady) window.__cuteQueue.push(event); });
</script>
<style>
  /* 교사가 자기 수업에 맞춰 따로 만든 앱이다. CUTE 화면과 같아 보일 이유가 없다.
     여기는 '측정 기록지' 쪽으로 잡았다. 각진 모서리, 모눈, 숫자는 고정폭. */
  :root {
    --ink: #14181d; --ink-2: #4d5661; --ink-3: #7d8792;
    --rule: #d7dde3; --rule-2: #eaeef2;
    --paper: #ffffff; --desk: #eef1f4;
    --mark: #0891b2; --mark-soft: #dcf2f7; --trend: #b45309;
    --mono: ui-monospace, "SFMono-Regular", "Roboto Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--desk);
    background-image: linear-gradient(var(--rule-2) 1px, transparent 1px), linear-gradient(90deg, var(--rule-2) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { display: flex; max-width: 880px; flex-direction: column; margin: 0 auto; gap: 0; padding: 18px 16px 28px; }
  header { border-bottom: 2px solid var(--ink); margin-bottom: 16px; padding-bottom: 10px; }
  .stamp { color: var(--mark); font-family: var(--mono); font-size: .69rem; font-weight: 700; letter-spacing: .06em; }
  header h1 { margin-top: 5px; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
  header p { margin-top: 4px; color: var(--ink-2); font-size: .79rem; }
  .card { border: 1px solid var(--rule); background: var(--paper); box-shadow: 0 1px 0 rgba(20,24,29,.04); }
  .card + .card { margin-top: 14px; }
  .card-label { border-bottom: 1px solid var(--rule-2); background: #f8fafb; padding: 7px 14px; color: var(--ink-2); font-family: var(--mono); font-size: .68rem; font-weight: 700; letter-spacing: .04em; }
  .card-body { padding: 14px; }
  .controls { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .field { display: flex; min-width: 0; flex-direction: column; gap: 5px; }
  .field > span { color: var(--ink-2); font-family: var(--mono); font-size: .69rem; font-weight: 700; letter-spacing: .02em; }
  select { width: 100%; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper); padding: 8px 9px; color: var(--ink); font: inherit; font-size: .84rem; }
  select:focus-visible { border-color: var(--mark); outline: 2px solid var(--mark-soft); }
  .toggle { display: flex; align-items: center; align-self: end; gap: 8px; border: 1px solid var(--rule); border-radius: 2px; padding: 8px 10px; cursor: pointer; font-size: .82rem; }
  .toggle input { width: 15px; height: 15px; accent-color: var(--trend); }
  .chart-card { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid line { stroke: var(--rule-2); stroke-width: 1; }
  .axis line, .axis path { stroke: #b9c2ca; stroke-width: 1; }
  .axis text { fill: var(--ink-3); font-family: var(--mono); font-size: 11px; }
  .axis-title { fill: var(--ink-2); font-family: inherit; font-size: 11.5px; font-weight: 700; }
  .dot { fill: var(--mark); fill-opacity: .85; stroke: var(--paper); stroke-width: 2; cursor: pointer; }
  .dot:hover, .dot:focus { fill-opacity: 1; stroke: var(--ink); }
  .trend { fill: none; stroke: var(--trend); stroke-dasharray: 7 4; stroke-width: 2; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; border-top: 1px dashed var(--rule); margin-top: 10px; padding-top: 9px; color: var(--ink-2); font-size: .72rem; }
  .legend i { display: inline-block; width: 22px; height: 0; margin-right: 6px; border-top: 2px dashed var(--trend); vertical-align: middle; }
  .legend b { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; background: var(--mark); vertical-align: middle; }
  .tip { position: absolute; display: none; border-radius: 2px; background: var(--ink); padding: 6px 9px; color: #fff; font-family: var(--mono); font-size: .72rem; line-height: 1.4; pointer-events: none; white-space: nowrap; }
  .readout { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; border-top: 2px solid var(--ink); margin-top: 12px; padding-top: 11px; }
  .readout .r { color: var(--mark); font-family: var(--mono); font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; }
  .readout .label { color: var(--ink-2); font-family: var(--mono); font-size: .71rem; letter-spacing: .02em; }
  .readout .verdict { border: 1px solid var(--rule); border-radius: 2px; padding: 2px 8px; color: var(--ink); font-size: .74rem; font-weight: 600; }
  .caution { border-left: 3px solid var(--trend); margin-top: 11px; padding-left: 9px; color: var(--ink-2); font-size: .73rem; }
  .prompt { margin-bottom: 8px; font-size: .84rem; font-weight: 600; }
  textarea { width: 100%; min-height: 96px; border: 1px solid var(--rule); border-radius: 2px; padding: 9px 10px; color: var(--ink); font: inherit; font-size: .85rem; resize: vertical; }
  textarea:focus-visible { border-color: var(--mark); outline: 2px solid var(--mark-soft); }
  .count { margin-top: 5px; color: var(--ink-3); font-family: var(--mono); font-size: .7rem; text-align: right; }
  details summary { cursor: pointer; color: var(--ink-2); font-family: var(--mono); font-size: .73rem; font-weight: 700; letter-spacing: .02em; }
  table { width: 100%; margin-top: 10px; border-collapse: collapse; font-family: var(--mono); font-size: .72rem; }
  th, td { border-bottom: 1px solid var(--rule-2); padding: 4px 6px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { border-bottom-color: var(--ink); color: var(--ink-2); font-weight: 700; }
  @media (max-width: 480px) { .wrap { padding: 14px 12px 22px; } .controls { grid-template-columns: 1fr; } }

<body>
<div class="wrap">
  <header>
    <div class="stamp">관찰 기록 · 2026 여름</div>
    <h1>무엇과 무엇이 함께 움직일까</h1>
    <p>어느 학교 앞 가게의 8월 30일 기록입니다. 두 변수를 골라 관계를 살펴보고, 알아낸 것을 적어 보세요.</p>
  </header>

  <section class="card">
    <div class="card-label">축 고르기</div>
    <div class="card-body controls">
      <label class="field"><span>가로축 X</span><select id="x-select"></select></label>
      <label class="field"><span>세로축 Y</span><select id="y-select"></select></label>
      <label class="toggle"><input type="checkbox" id="trend-toggle" /><span>추세선 보기</span></label>
    </div>
  </section>

  <section class="card chart-card">
    <div class="card-label">산점도</div>
    <div class="card-body">
      <svg id="chart" viewBox="0 0 620 380" role="img" aria-labelledby="chart-title"><title id="chart-title">산점도</title></svg>
      <div class="tip" id="tip"></div>
      <div class="legend"><span><b></b>하루</span><span id="legend-trend" hidden><i></i>추세선</span></div>
      <div class="readout">
        <span class="r" id="r-value">—</span>
        <span class="label">상관계수 r · n=30</span>
        <span class="verdict" id="r-verdict">—</span>
      </div>
      <p class="caution">함께 움직인다고 해서 한쪽이 다른 쪽의 원인은 아닙니다. 숨은 다른 이유가 있을 수 있어요.</p>
    </div>
  </section>

  <section class="card">
    <div class="card-label">기록</div>
    <div class="card-body">
      <p class="prompt" id="conclusion-prompt">어떤 두 변수를 골랐고, 그래프에서 무엇이 보였나요? 예상과 달랐던 점이 있다면 그것도 적어 보세요.</p>
      <textarea id="conclusion" aria-labelledby="conclusion-prompt" placeholder="본 것을 그대로 적어도 좋습니다."></textarea>
      <div class="count" id="count">0자</div>
    </div>
  </section>

  <details class="card">
    <summary class="card-label">원본 데이터 30행</summary>
    <div class="card-body"><table id="data-table"><thead></thead><tbody></tbody></table></div>
  </details>
</div>

    {"날짜":"8/26","기온":27.3,"습도":72,"강수량":0,"아이스크림":329,"따뜻한음료":141,"방문자":378},
    {"날짜":"8/27","기온":32.9,"습도":72,"강수량":18.9,"아이스크림":451,"따뜻한음료":88,"방문자":422},
    {"날짜":"8/28","기온":34.6,"습도":75,"강수량":0,"아이스크림":539,"따뜻한음료":16,"방문자":404},
    {"날짜":"8/29","기온":27.4,"습도":73,"강수량":0,"아이스크림":327,"따뜻한음료":132,"방문자":388},
    {"날짜":"8/30","기온":27.7,"습도":72,"강수량":0,"아이스크림":317,"따뜻한음료":156,"방문자":464}
  ];
  var FIELDS = [
    { key: "기온", label: "기온 (°C)" },
    { key: "습도", label: "습도 (%)" },
    { key: "강수량", label: "강수량 (mm)" },
    { key: "아이스크림", label: "아이스크림 판매량 (개)" },
    { key: "따뜻한음료", label: "따뜻한 음료 판매량 (잔)" },
    { key: "방문자", label: "방문자 수 (명)" }
  ];
  var labelOf = function (key) { var f = FIELDS.filter(function (i) { return i.key === key; })[0]; return f ? f.label : key; };

  /* ── 활동 기록 ─────────────────────────────────────────────────
     CUTE 규격: 이 앱이 로그를 직접 들고 있다가 저장할 때마다 통째로 보낸다.
     클릭 하나하나가 아니라 교사가 읽을 수 있는 말로 남긴다. */
  var MAX_EVENTS = 200;
  var events = [];
  function note(action, detail, coalesce) {
    var last = events[events.length - 1];
    // 같은 행동을 연달아 하면(축을 여러 번 돌려 보는 등) 마지막 것만 남긴다.
    if (coalesce && last && last.action === action) { last.detail = detail; last.at = new Date().toISOString(); return; }
    events.push({ at: new Date().toISOString(), action: action, detail: detail });
    if (events.length > MAX_EVENTS) events = events.slice(-MAX_EVENTS);
  }

  /* ── 상태 ──────────────────────────────────────────────────── */
  var state = { x: "기온", y: "아이스크림", trend: false, conclusion: "" };

  function corr(xs, ys) {
    var n = xs.length, mx = 0, my = 0, i;
    for (i = 0; i < n; i++) { mx += xs[i]; my += ys[i]; }
    mx /= n; my /= n;
    var num = 0, dx = 0, dy = 0;
    for (i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); dx += Math.pow(xs[i] - mx, 2); dy += Math.pow(ys[i] - my, 2); }
    var den = Math.sqrt(dx * dy);
    return den === 0 ? 0 : num / den;
  }
  function verdictOf(r) {
    var a = Math.abs(r), dir = r > 0 ? "같이 커지는" : "반대로 움직이는";

  var NS = "http://www.w3.org/2000/svg";

  function draw() {

    svg.appendChild(el("title", { id: "chart-title" }, labelOf(state.x) + "과(와) " + labelOf(state.y) + "의 산점도"));

    // viewBox를 실제 픽셀 폭에 맞춘다. 고정 viewBox를 쓰면 좁은 화면에서 그래프가
    // 통째로 축소되어 축 숫자가 읽을 수 없을 만큼 작아진다.
    var W = Math.max(280, Math.round(svg.parentNode.clientWidth - 28)) || 620;
    var H = Math.round(Math.max(240, Math.min(390, W * 0.62)));

    var m = { t: 14, r: narrow ? 10 : 16, b: narrow ? 44 : 48, l: narrow ? 50 : 62 };
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var xWant = narrow ? 3 : 5, yWant = narrow ? 4 : 5;
    var xs = ROWS.map(function (r) { return r[state.x]; });
    var ys = ROWS.map(function (r) { return r[state.y]; });
    var xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
    var yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
    var padX = (xMax - xMin) * 0.08 || 1, padY = (yMax - yMin) * 0.08 || 1;
    xMin -= padX; xMax += padX; yMin = Math.max(0, yMin - padY); yMax += padY;
    var px = function (v) { return m.l + (v - xMin) / (xMax - xMin) * (W - m.l - m.r); };

    ticks(yMin, yMax, yWant).forEach(function (v) { grid.appendChild(el("line", { x1: m.l, x2: W - m.r, y1: py(v), y2: py(v) })); });

    axis.appendChild(el("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b }));

    ticks(yMin, yMax, yWant).forEach(function (v) { axis.appendChild(el("text", { x: m.l - 9, y: py(v) + 4, "text-anchor": "end" }, String(v))); });
    axis.appendChild(el("text", { x: (m.l + W - m.r) / 2, y: H - 8, "text-anchor": "middle", class: "axis-title" }, labelOf(state.x)));
    var yTitleX = narrow ? 12 : 14;
    axis.appendChild(el("text", { x: yTitleX, y: (m.t + H - m.b) / 2, "text-anchor": "middle", class: "axis-title", transform: "rotate(-90 " + yTitleX + " " + ((m.t + H - m.b) / 2) + ")" }, labelOf(state.y)));
    svg.appendChild(axis);

    if (state.trend) {
      var n = xs.length, sx = 0, sy = 0, i;
      for (i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; }
      var mx = sx / n, my = sy / n, num = 0, den = 0;
      for (i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += Math.pow(xs[i] - mx, 2); }
      var slope = den === 0 ? 0 : num / den, intercept = my - slope * mx;
      svg.appendChild(el("line", { class: "trend", x1: px(xMin), y1: py(slope * xMin + intercept), x2: px(xMax), y2: py(slope * xMax + intercept) }));
    }

    ROWS.forEach(function (row) {
      var dot = el("circle", { class: "dot", cx: px(row[state.x]), cy: py(row[state.y]), r: 5.5, tabindex: "0",
        "aria-label": row["날짜"] + " " + labelOf(state.x) + " " + row[state.x] + ", " + labelOf(state.y) + " " + row[state.y] });
      var show = function () {
        tip.innerHTML = "<b>" + row["날짜"] + "</b><br>" + state.x + " " + row[state.x] + "<br>" + state.y + " " + row[state.y];
        tip.style.display = "block";
        var box = svg.getBoundingClientRect(), card = svg.parentNode.getBoundingClientRect();
        tip.style.left = (box.left - card.left + px(row[state.x]) / W * box.width + 10) + "px";
        tip.style.top = (box.top - card.top + py(row[state.y]) / H * box.height - 8) + "px";
      };
      var hide = function () { tip.style.display = "none"; };
      dot.addEventListener("mouseenter", show); dot.addEventListener("focus", show);
      dot.addEventListener("mouseleave", hide); dot.addEventListener("blur", hide);
      svg.appendChild(dot);
    });

    var r = corr(xs, ys);
    document.getElementById("r-value").textContent = (r >= 0 ? "+" : "") + r.toFixed(2);
    document.getElementById("r-verdict").textContent = verdictOf(r);
    return r;
  }

  /* ── 화면 연결 ─────────────────────────────────────────────── */
  var xSelect = document.getElementById("x-select");
  var ySelect = document.getElementById("y-select");
  var trendToggle = document.getElementById("trend-toggle");
  var conclusion = document.getElementById("conclusion");
  var countEl = document.getElementById("count");

  FIELDS.forEach(function (f) {
    [xSelect, ySelect].forEach(function (sel) {
      var option = document.createElement("option");
      option.value = f.key; option.textContent = f.label;
      sel.appendChild(option);
    });
  });

  function render() {
    xSelect.value = state.x; ySelect.value = state.y; trendToggle.checked = state.trend;
    document.getElementById("legend-trend").hidden = !state.trend;
    if (conclusion.value !== state.conclusion) conclusion.value = state.conclusion;
    countEl.textContent = state.conclusion.length + "자";
    return draw();
  }

  xSelect.addEventListener("change", function () { state.x = xSelect.value; note("가로축 바꿈", labelOf(state.x), true); render(); });
  ySelect.addEventListener("change", function () { state.y = ySelect.value; note("세로축 바꿈", labelOf(state.y), true); render(); });
  trendToggle.addEventListener("change", function () { state.trend = trendToggle.checked; document.getElementById("legend-trend").hidden = !state.trend; note(state.trend ? "추세선 켬" : "추세선 끔", labelOf(state.x) + " · " + labelOf(state.y)); render(); });

  var typingTimer = null;
  conclusion.addEventListener("input", function () {
    state.conclusion = conclusion.value;
    countEl.textContent = state.conclusion.length + "자";
    // 글자마다 기록하면 로그가 아니라 소음이 된다. 멈췄을 때 한 줄로 남긴다.
    window.clearTimeout(typingTimer);
    typingTimer = window.setTimeout(function () {
      if (state.conclusion.trim()) note("결론 씀", state.conclusion.trim().slice(0, 120), true);
    }, 1200);
  });

  var thead = document.querySelector("#data-table thead");
  var tbody = document.querySelector("#data-table tbody");
  var headRow = document.createElement("tr");
  ["날짜"].concat(FIELDS.map(function (f) { return f.key; })).forEach(function (key) {
    var th = document.createElement("th"); th.textContent = key; headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  ROWS.forEach(function (row) {
    var tr = document.createElement("tr");
    ["날짜"].concat(FIELDS.map(function (f) { return f.key; })).forEach(function (key) {
      var td = document.createElement("td"); td.textContent = row[key]; tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  /* ── CUTE 연동 ─────────────────────────────────────────────── */
  var CUTE_ORIGINS = ["https://cute.sanskit.com"];
  var DEV_ORIGIN = /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/;
  function allowedOrigin(origin) { return CUTE_ORIGINS.indexOf(origin) !== -1 || DEV_ORIGIN.test(origin); }

  function getCurrentState() {
    // 활동 로그도 함께 넣는다. 그래야 새로고침하고 돌아와도 과정이 이어진다.
    return { schemaVersion: 1, x: state.x, y: state.y, trend: state.trend, conclusion: state.conclusion, events: events };
  }
  function getActivity() {
    var r = corr(ROWS.map(function (row) { return row[state.x]; }), ROWS.map(function (row) { return row[state.y]; }));
    var results = [
      { label: "가로축 변수", prompt: "관계를 살펴볼 두 변수 중 가로축으로 무엇을 골랐나요?", value: labelOf(state.x) },
      { label: "세로축 변수", prompt: "관계를 살펴볼 두 변수 중 세로축으로 무엇을 골랐나요?", value: labelOf(state.y) },
      { label: "상관계수", value: (r >= 0 ? "+" : "") + r.toFixed(2) + " (" + verdictOf(r) + ")" }
    ];
    // 정답이 정해진 활동이 아니다. correct는 어디에도 넣지 않는다.
    // CUTE는 이 앱 안에 어떤 과제가 있는지 모른다. 물음을 함께 보내야 답이 읽힌다.
    if (state.conclusion.trim()) results.push({
      label: "학생이 쓴 결론",
      prompt: document.getElementById("conclusion-prompt").textContent.trim(),
      value: state.conclusion.trim().slice(0, 500)
    });
    return { schemaVersion: 1, events: events, results: results };
  }
  function restore(saved) {
    if (!saved || typeof saved !== "object") return;
    if (FIELDS.some(function (f) { return f.key === saved.x; })) state.x = saved.x;
    if (FIELDS.some(function (f) { return f.key === saved.y; })) state.y = saved.y;
    state.trend = saved.trend === true;
    state.conclusion = typeof saved.conclusion === "string" ? saved.conclusion : "";
    if (Array.isArray(saved.events)) {
      events = saved.events.filter(function (e) { return e && typeof e.action === "string"; }).slice(-MAX_EVENTS);
    }
    render();
    note("이어서 열기", labelOf(state.x) + " · " + labelOf(state.y));
  }

  var answered = {};
  function handle(event) {
    if (event.source !== window.parent) return;
    if (!allowedOrigin(event.origin)) return;
    var msg = event.data;
    if (!msg || typeof msg !== "object") return;
    if (msg.cute === "state-request") {
      if (typeof msg.requestId !== "string" || answered[msg.requestId]) return;
      answered[msg.requestId] = true;
      var payload = { cute: "state-result", requestId: msg.requestId, state: {} };
      try { payload.state = getCurrentState(); } catch (error) { payload.state = {}; }
      // 활동 기록을 만들다 실패해도 저장 자체는 멈추면 안 된다.
      try { var activity = getActivity(); if (activity) payload.activity = activity; } catch (error) {}
      event.source.postMessage(payload, event.origin);
      return;
    }
    if (msg.cute === "state-restore") { try { restore(msg.state); } catch (error) {} }
  }

  var resizeTimer = null;
  if (window.ResizeObserver) {
    new window.ResizeObserver(function () {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(function () { draw(); }, 120);
    }).observe(svg.parentNode);
  }

  render();
  note("데이터 불러옴", "8월 30일치 · 6개 변수");
  window.addEventListener("message", handle);
  window.__cuteReady = true;
  (window.__cuteQueue || []).forEach(handle);
  window.__cuteQueue = [];
})();
</script>
</body>
</html>
