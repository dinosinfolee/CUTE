name: Deploy CUTE JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: JupyterLite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: JupyterLite 빌드
        run: jupyter lite build --output-dir dist

      - name: CUTE 연결 스크립트와 배색 삽입
        run: |
          mkdir -p dist/cute-assets
          cp content/CUTE_template.ipynb dist/cute-assets/CUTE_template.ipynb
          cp cute-bridge.js dist/lab/cute-bridge-v18.js
          cp cute-theme.css dist/lab/cute-theme.css
          python - <<'PY'
          from pathlib import Path
          page = Path("dist/lab/index.html")
          html = page.read_text(encoding="utf-8")
          marker = '    <script>\n      (async function () {'
          storage = Path("cute-storage.js").read_text(encoding="utf-8")
          html = html.replace('      }.call(this));', storage + '\n      }.call(this));', 1)
          html = html.replace('</head>', '<link rel="stylesheet" href="cute-theme.css"><script defer src="cute-bridge-v18.js"></script></head>', 1)
          page.write_text(html, encoding="utf-8")
          PY
          grep -q 'contentsStorageName = "CUTE Contents' dist/lab/index.html
          grep -q cute-bridge-v18 dist/lab/index.html
          echo "삽입 확인 완료"

      - name: Jekyll 처리 끄기
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./JupyterLite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
