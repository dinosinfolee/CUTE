name: Deploy OwnThink JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: JupyterLite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: JupyterLite 빌드
        run: jupyter lite build --contents content --output-dir dist

      - name: OwnThink 연결 스크립트와 배색 삽입
        run: |
          cp ownthink-bridge.js dist/lab/ownthink-bridge-v1.js
          cp ownthink-theme.css dist/lab/ownthink-theme.css
          sed -i 's#</head>#<link rel="stylesheet" href="ownthink-theme.css"><script defer src="ownthink-bridge-v1.js"></script></head>#' dist/lab/index.html
          grep -q ownthink-bridge-v1 dist/lab/index.html
          echo "삽입 확인 완료"

      - name: Jekyll 처리 끄기
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./JupyterLite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
